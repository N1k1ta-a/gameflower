<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя 💐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffe0ec 0%, #ffd1e8 50%, #e0c3fc 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 10px;
  }

  .container {
    text-align: center;
    padding: 20px;
    max-width: 500px;
    width: 100%;
  }

  .card {
    background: rgba(255,255,255,0.85);
    border-radius: 30px;
    padding: 35px 25px;
    box-shadow: 0 20px 60px rgba(255,105,180,0.3);
    border: 2px solid rgba(255,255,255,0.9);
  }

  h1 {
    font-size: 1.8rem;
    color: #d6336c;
    margin-bottom: 10px;
  }

  .subtitle {
    color: #a8648a;
    font-size: 0.95rem;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  #gameArea {
    position: relative;
    width: 100%;
    height: 320px;
    background: linear-gradient(180deg, #fff5fa 0%, #ffe8f3 100%);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 18px;
    border: 2px dashed #ffb3d1;
    cursor: crosshair;
  }

  .flower {
    position: absolute;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    line-height: 1;
    cursor: pointer;
    filter: drop-shadow(0 3px 5px rgba(255,105,180,0.4));
    z-index: 5;
    transition: transform 0.15s;
  }

  .flower:hover {
    transform: scale(1.1);
  }

  .flower.caught {
    transform: scale(1.8) rotate(25deg) !important;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: none;
  }

  .score-box {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 16px;
    font-size: 1rem;
    color: #a8648a;
    font-weight: 600;
  }

  .score-box span { color: #d6336c; }

  .progress-bar {
    width: 100%;
    height: 14px;
    background: #ffe0ec;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff8fab, #ff5c8a, #d6336c);
    border-radius: 10px;
    transition: width 0.3s ease;
  }

  button {
    background: linear-gradient(135deg, #ff8fab, #d6336c);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 1.1rem;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(214,51,108,0.4);
    transition: transform 0.2s;
  }

  button:hover { transform: translateY(-3px); }
  button:active { transform: translateY(0); }

  .hidden { display: none !important; }

  .final-message {
    color: #d6336c;
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 15px 0;
  }

  .hearts {
    font-size: 2rem;
    margin: 10px 0;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .bouquet {
    font-size: 3rem;
    margin: 10px 0;
    letter-spacing: 5px;
  }

  .plus {
    position: absolute;
    color: #d6336c;
    font-weight: 900;
    font-size: 1.4rem;
    pointer-events: none;
    animation: floatUp 0.7s ease-out forwards;
    z-index: 10;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-50px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">

    <div id="startScreen">
      <h1>Привет, солнышко 🌸</h1>
      <p class="subtitle">
        Это маленькая игра специально для тебя.<br>
        Собери букет из 12 цветов — и получишь сюрприз 💌
      </p>
      <div class="hearts">💖💐💖</div>
      <button onclick="startGame()">Начать ✨</button>
    </div>

    <div id="gameScreen" class="hidden">
      <div class="score-box">
        <div>Собрано: <span id="score">0</span>/12</div>
        <div>Промахи: <span id="misses">0</span></div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div id="gameArea"></div>
      <p style="font-size:0.8rem;color:#b088a0;">Нажимай на цветочки 🌷</p>
    </div>

    <div id="endScreen" class="hidden">
      <div class="bouquet">💐</div>
      <h1>Букет собран!</h1>
      <p class="final-message" id="finalMsg"></p>
      <div class="hearts">💕</div>
      <button onclick="restart()">Ещё раз 🎈</button>
    </div>

  </div>
</div>

<script>
const flowers = ['🌸','🌺','🌷','🌹','🌻','💐','🌼','💮','🏵️'];
const target = 12;
let score = 0;
let misses = 0;
let gameActive = false;
let spawnTimer = null;

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const gameArea    = document.getElementById('gameArea');
const scoreEl     = document.getElementById('score');
const missesEl    = document.getElementById('misses');
const progressEl  = document.getElementById('progress');

function startGame() {
  startScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  endScreen.classList.add('hidden');

  score = 0;
  misses = 0;
  gameActive = true;
  scoreEl.textContent = '0';
  missesEl.textContent = '0';
  progressEl.style.width = '0%';
  gameArea.innerHTML = '';

  spawnFlower();
  spawnTimer = setInterval(spawnFlower, 800);
}

function spawnFlower() {
  if (!gameActive) return;

  const flower = document.createElement('div');
  flower.className = 'flower';

  const isBonus = Math.random() < 0.12;
  flower.textContent = isBonus ? '💖' : flowers[Math.floor(Math.random() * flowers.length)];
  flower.dataset.bonus = isBonus ? 'true' : 'false';

  const areaW = gameArea.clientWidth;
  const areaH = gameArea.clientHeight;
  const size = 56;
  const x = Math.random() * (areaW - size);
  const y = Math.random() * (areaH - size);
  flower.style.left = x + 'px';
  flower.style.top  = y + 'px';

  gameArea.appendChild(flower);

  setTimeout(() => {
    if (flower.parentNode && !flower.classList.contains('caught')) {
      flower.remove();
      misses++;
      missesEl.textContent = misses;
    }
  }, 2400);
}

function handleHit(clientX, clientY) {
  if (!gameActive) return;

  const rect = gameArea.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const allFlowers = Array.from(gameArea.querySelectorAll('.flower:not(.caught)'));
  let hit = null;

  for (let i = allFlowers.length - 1; i >= 0; i--) {
    const f = allFlowers[i];
    const fx = parseFloat(f.style.left);
    const fy = parseFloat(f.style.top);
    const fw = 56, fh = 56;
    const pad = 8;
    if (x >= fx - pad && x <= fx + fw + pad &&
        y >= fy - pad && y <= fy + fh + pad) {
      hit = f;
      break;
    }
  }

  if (!hit) return;
  catchFlower(hit);
}

gameArea.addEventListener('mousedown', (e) => {
  handleHit(e.clientX, e.clientY);
});

gameArea.addEventListener('touchstart', (e) => {
  if (e.touches.length > 0) {
    handleHit(e.touches[0].clientX, e.touches[0].clientY);
  }
  e.preventDefault();
}, { passive: false });

function catchFlower(flower) {
  if (!gameActive) return;
  if (flower.classList.contains('caught')) return;

  flower.classList.add('caught');

  const bonus = flower.dataset.bonus === 'true';
  const points = bonus ? 2 : 1;

  score += points;
  if (score > target) score = target;

  scoreEl.textContent = score;
  progressEl.style.width = (score / target * 100) + '%';

  const plus = document.createElement('div');
  plus.className = 'plus';
  plus.textContent = '+' + points;
  plus.style.left = flower.style.left;
  plus.style.top  = flower.style.top;
  gameArea.appendChild(plus);
  setTimeout(() => plus.remove(), 700);

  setTimeout(() => flower.remove(), 300);

  if (score >= target) endGame();
}

function endGame() {
  gameActive = false;
  clearInterval(spawnTimer);

  setTimeout(() => {
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');

    const msg = document.getElementById('finalMsg');

    if (misses === 0) {
      msg.innerHTML = 'Идеально! Ни одного промаха 🎯<br><br>' +
        'Ты лучшая моя девочка, просто умничка. Как и этот букет — ' +
        'ты делаешь мои дни лучше. Поэтому я и хочу радовать тебя вот так, любимка 💖<br><br>' +
        'Ты самое лучшее, что есть у меня. Помни это всегда. ' +
        'И знай — я тебя очень-очень сильно люблю 🌷💕';
    } else if (misses <= 4) {
      msg.innerHTML = 'Ты собрала целый букет счастья 🌸<br><br>' +
        'Пусть твоя улыбка сегодня и всегда будет такой же прекрасной, ' +
        'как эти цветочки. Ты заслуживаешь всего самого доброго ✨<br><br>' +
        'И помни: я тебя очень сильно люблю 💗';
    } else {
      msg.innerHTML = 'Букет собран! 💐<br><br>' +
        'Даже если что-то не получалось с первого раза — главное, что ты не сдалась. ' +
        'Так и в жизни: всё обязательно получится 🌼<br><br>' +
        'Ты молодец. Ты самое лучшее, что есть у меня. ' +
        'И я тебя очень сильно люблю 💖';
    }
  }, 400);
}

function restart() {
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
}
</script>

</body>
</html>
